server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-hosted API (submissions + analytics) -- see server/app.py.
    # Routed through this same host/port so Synology's reverse proxy or
    # router only needs to forward ONE port to this container.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        # Append rather than overwrite: if this container sits behind another
        # proxy (Synology's DSM reverse proxy, a Cloudflare Tunnel), that hop
        # already set a real client IP here -- overwriting it with $remote_addr
        # (this hop's peer, i.e. the upstream proxy itself) collapses every
        # visitor onto one IP for the API's per-IP rate limiter. Appending
        # preserves the original client IP as the first entry, which is what
        # server/app.py's rate_limited() reads via .split(",")[0].
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://api:5000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The generated site (dist/) -- entry pages, hubs, sitemap, submit page.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/html application/xml;
}
